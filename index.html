<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Snake - Simple Canvas Game</title>
    <style>
      :root {
        --bg: #0b1020;
        --panel: #0f1630;
        --grid: #131b3c;
        --snake: #3ddc84;
        --snake-head: #84f7b7;
        --food: #ff5a5f;
        --text: #e6edff;
        --muted: #9fb2ff;
        --accent: #6c8cff;
      }

      html, body {
        height: 100%;
      }

      body {
        margin: 0;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
        color: var(--text);
        background: radial-gradient(1000px 800px at 20% 10%, #0f1530, #090d1d) no-repeat fixed;
        display: grid;
        place-items: center;
      }

      .shell {
        width: min(92vw, 760px);
        display: grid;
        gap: 16px;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      h1 {
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 0.3px;
        margin: 0;
      }

      .hud {
        display: flex;
        align-items: center;
        gap: 14px;
        background: color-mix(in oklab, var(--panel) 88%, black);
        border: 1px solid color-mix(in oklab, var(--panel), white 6%);
        border-radius: 12px;
        padding: 10px 12px;
      }

      .stat {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 10px;
        border-radius: 999px;
        background: color-mix(in oklab, var(--panel) 78%, black);
        border: 1px solid color-mix(in oklab, var(--panel), white 10%);
        font-weight: 600;
      }

      .muted {
        color: var(--muted);
        font-weight: 500;
      }

      .board-wrap {
        position: relative;
        width: min(92vw, 520px);
        margin: 0 auto;
        aspect-ratio: 1 / 1;
        background: color-mix(in oklab, var(--panel) 84%, black);
        border-radius: 16px;
        border: 1px solid color-mix(in oklab, var(--panel), white 10%);
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35), inset 0 0 0 1px rgba(255,255,255,0.02);
        overflow: hidden;
      }

      canvas {
        width: 100%;
        height: 100%;
        display: block;
        image-rendering: pixelated;
      }

      .overlay {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        background: color-mix(in oklab, black 40%, transparent);
        opacity: 0;
        pointer-events: none;
        transition: opacity 140ms ease;
      }

      .overlay.active {
        opacity: 1;
        pointer-events: auto;
      }

      .card {
        display: grid;
        gap: 12px;
        padding: 18px 20px;
        background: color-mix(in oklab, var(--panel) 92%, black);
        border: 1px solid color-mix(in oklab, var(--panel), white 12%);
        border-radius: 14px;
        text-align: center;
        max-width: 80%;
      }

      .title {
        font-size: 18px;
        font-weight: 700;
      }

      .subtle { color: #b9c7ff; }

      .row { display: flex; gap: 10px; justify-content: center; }

      button {
        appearance: none;
        background: linear-gradient(180deg, color-mix(in oklab, var(--accent), white 8%), var(--accent));
        color: white;
        border: 0;
        border-radius: 12px;
        padding: 10px 14px;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 10px 20px rgba(108, 140, 255, 0.35), inset 0 0 0 1px rgba(255,255,255,0.15);
      }

      button.secondary {
        background: color-mix(in oklab, var(--panel) 74%, black);
        color: var(--text);
        box-shadow: inset 0 0 0 1px rgba(255,255,255,0.10);
      }

      .help {
        font-size: 13px;
        opacity: 0.9;
      }

      .kbd {
        display: inline-grid;
        min-width: 20px;
        place-items: center;
        padding: 2px 6px;
        margin: 0 2px;
        border-radius: 6px;
        background: color-mix(in oklab, var(--panel) 88%, black);
        border: 1px solid color-mix(in oklab, var(--panel), white 10%);
        font-weight: 700;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header>
        <h1>Snake</h1>
        <div class="hud" aria-label="Scoreboard">
          <div class="stat">Score: <span id="score">0</span></div>
          <div class="stat">High: <span id="high">0</span></div>
        </div>
      </header>

      <div class="board-wrap">
        <canvas id="game" width="400" height="400" aria-label="Snake game board"></canvas>
        <div class="overlay" id="overlay">
          <div class="card">
            <div class="title" id="overlayTitle">Snake</div>
            <div id="overlaySubtitle" class="subtle">Eat the food, don't hit yourself or the walls.</div>
            <div class="row">
              <button id="startBtn">Start</button>
              <button id="restartBtn" class="secondary" style="display:none">Restart</button>
            </div>
            <div class="help">
              Controls: <span class="kbd">←</span><span class="kbd">→</span><span class="kbd">↑</span><span class="kbd">↓</span> or WASD ·
              <span class="kbd">P</span> pause · <span class="kbd">R</span> restart
            </div>
          </div>
        </div>
      </div>

      <div class="help">
        Tip: You can also press Enter/Space to (re)start.
      </div>
    </div>

    <script>
      (function() {
        const canvas = /** @type {HTMLCanvasElement} */ (document.getElementById('game'));
        const ctx = canvas.getContext('2d');
        if (!ctx) throw new Error('Canvas 2D context not available');

        // Grid config
        const gridCells = 20; // 20x20 grid
        const cellSize = Math.floor(canvas.width / gridCells); // 20px at 400x400
        const boardSizePx = cellSize * gridCells; // ensure clean snap
        canvas.width = boardSizePx;
        canvas.height = boardSizePx;

        // Colors
        const colors = {
          background: getComputedStyle(document.documentElement).getPropertyValue('--panel').trim() || '#0f1630',
          grid: getComputedStyle(document.documentElement).getPropertyValue('--grid').trim() || '#131b3c',
          snake: getComputedStyle(document.documentElement).getPropertyValue('--snake').trim() || '#3ddc84',
          snakeHead: getComputedStyle(document.documentElement).getPropertyValue('--snake-head').trim() || '#84f7b7',
          food: getComputedStyle(document.documentElement).getPropertyValue('--food').trim() || '#ff5a5f',
        };

        // DOM
        const scoreEl = document.getElementById('score');
        const highEl = document.getElementById('high');
        const overlayEl = document.getElementById('overlay');
        const overlayTitleEl = document.getElementById('overlayTitle');
        const overlaySubtitleEl = document.getElementById('overlaySubtitle');
        const startBtn = document.getElementById('startBtn');
        const restartBtn = document.getElementById('restartBtn');

        // Game state
        /** @typedef {{x:number,y:number}} Point */
        /** @type {Point[]} */
        let snakeBody = [];
        /** @type {Point} */
        let food = { x: 10, y: 10 };
        /** @type {'up'|'down'|'left'|'right'} */
        let direction = 'right';
        /** @type {'idle'|'running'|'paused'|'over'} */
        let phase = 'idle';
        let score = 0;
        let highScore = Number(localStorage.getItem('snakeHighScore') || '0') | 0;
        updateHud();

        // Speed control (ms per step). Slightly accelerate as score grows.
        const baseStepMs = 140;
        const minStepMs = 70;
        let currentStepMs = baseStepMs;
        let timerId = /** @type {number|null} */(null);
        let pendingDirection = /** @type {null | 'up'|'down'|'left'|'right'} */ (null);

        function resetGame() {
          score = 0;
          currentStepMs = baseStepMs;
          direction = 'right';
          pendingDirection = null;
          const center = Math.floor(gridCells / 2);
          snakeBody = [
            { x: center - 1, y: center },
            { x: center - 2, y: center },
            { x: center - 3, y: center },
          ];
          food = randomFreeCell();
          updateHud();
          draw();
        }

        function updateHud() {
          scoreEl.textContent = String(score);
          highEl.textContent = String(highScore);
        }

        function startLoop() {
          stopLoop();
          timerId = window.setInterval(tick, currentStepMs);
        }

        function stopLoop() {
          if (timerId !== null) {
            clearInterval(timerId);
            timerId = null;
          }
        }

        function setPhase(next) {
          phase = next;
          if (phase === 'running') {
            overlayEl.classList.remove('active');
          } else {
            overlayEl.classList.add('active');
          }
          if (phase === 'idle') {
            overlayTitleEl.textContent = 'Snake';
            overlaySubtitleEl.textContent = 'Eat the food, don\'t hit yourself or the walls.';
            startBtn.style.display = '';
            restartBtn.style.display = 'none';
          } else if (phase === 'paused') {
            overlayTitleEl.textContent = 'Paused';
            overlaySubtitleEl.textContent = 'Press P to resume';
            startBtn.style.display = 'none';
            restartBtn.style.display = '';
          } else if (phase === 'over') {
            overlayTitleEl.textContent = 'Game Over';
            overlaySubtitleEl.textContent = 'Press R or the button to restart';
            startBtn.style.display = 'none';
            restartBtn.style.display = '';
          }
        }

        function startGame() {
          resetGame();
          setPhase('running');
          startLoop();
        }

        function restartGame() {
          resetGame();
          setPhase('running');
          startLoop();
        }

        function pauseGame() {
          if (phase !== 'running') return;
          setPhase('paused');
          stopLoop();
        }

        function resumeGame() {
          if (phase !== 'paused') return;
          setPhase('running');
          startLoop();
        }

        function gameOver() {
          setPhase('over');
          stopLoop();
          if (score > highScore) {
            highScore = score;
            try { localStorage.setItem('snakeHighScore', String(highScore)); } catch {}
          }
          updateHud();
        }

        function accelerate() {
          const target = Math.max(minStepMs, baseStepMs - Math.floor(score / 3) * 8);
          if (target !== currentStepMs) {
            currentStepMs = target;
            if (phase === 'running') startLoop(); // apply new speed
          }
        }

        // Core tick
        function tick() {
          // Apply any buffered direction (prevents double-turn issue within one tick)
          if (pendingDirection) {
            direction = pendingDirection;
            pendingDirection = null;
          }

          const head = snakeBody[0];
          const nextHead = { x: head.x, y: head.y };
          if (direction === 'up') nextHead.y -= 1;
          else if (direction === 'down') nextHead.y += 1;
          else if (direction === 'left') nextHead.x -= 1;
          else if (direction === 'right') nextHead.x += 1;

          // Wall collision
          if (
            nextHead.x < 0 || nextHead.x >= gridCells ||
            nextHead.y < 0 || nextHead.y >= gridCells
          ) {
            gameOver();
            draw();
            return;
          }

          // Self collision (check against all segments)
          for (let i = 0; i < snakeBody.length; i++) {
            const seg = snakeBody[i];
            if (seg.x === nextHead.x && seg.y === nextHead.y) {
              gameOver();
              draw();
              return;
            }
          }

          // Move
          snakeBody.unshift(nextHead);

          // Eat food?
          if (nextHead.x === food.x && nextHead.y === food.y) {
            score += 1;
            updateHud();
            accelerate();
            food = randomFreeCell();
          } else {
            snakeBody.pop(); // no growth this turn
          }

          draw();
        }

        function randomFreeCell() {
          // Avoid infinite loop by sampling; fallback scans grid
          const maxAttempts = 100;
          for (let i = 0; i < maxAttempts; i++) {
            const p = { x: Math.floor(Math.random() * gridCells), y: Math.floor(Math.random() * gridCells) };
            if (!isOccupied(p)) return p;
          }
          for (let x = 0; x < gridCells; x++) {
            for (let y = 0; y < gridCells; y++) {
              const p = { x, y };
              if (!isOccupied(p)) return p;
            }
          }
          // Extremely unlikely; place off-board to avoid crash
          return { x: 0, y: 0 };
        }

        function isOccupied(p) {
          for (const seg of snakeBody) {
            if (seg.x === p.x && seg.y === p.y) return true;
          }
          return false;
        }

        function draw() {
          // Background
          ctx.fillStyle = colors.background;
          ctx.fillRect(0, 0, canvas.width, canvas.height);

          // Subtle grid
          ctx.strokeStyle = colors.grid;
          ctx.lineWidth = 1;
          ctx.globalAlpha = 0.6;
          for (let i = 1; i < gridCells; i++) {
            const pos = i * cellSize + 0.5; // align to pixel
            ctx.beginPath();
            ctx.moveTo(pos, 0);
            ctx.lineTo(pos, canvas.height);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(0, pos);
            ctx.lineTo(canvas.width, pos);
            ctx.stroke();
          }
          ctx.globalAlpha = 1;

          // Food (rounded square)
          drawRoundedRect(food.x * cellSize + 2, food.y * cellSize + 2, cellSize - 4, cellSize - 4, 4, colors.food);

          // Snake
          for (let i = snakeBody.length - 1; i >= 0; i--) {
            const seg = snakeBody[i];
            const x = seg.x * cellSize;
            const y = seg.y * cellSize;
            const pad = i === 0 ? 1 : 2;
            const c = i === 0 ? colors.snakeHead : colors.snake;
            drawRoundedRect(x + pad, y + pad, cellSize - pad * 2, cellSize - pad * 2, 5, c);
          }
        }

        function drawRoundedRect(x, y, w, h, r, fillStyle) {
          ctx.fillStyle = fillStyle;
          const rr = Math.min(r, w / 2, h / 2);
          ctx.beginPath();
          ctx.moveTo(x + rr, y);
          ctx.arcTo(x + w, y, x + w, y + h, rr);
          ctx.arcTo(x + w, y + h, x, y + h, rr);
          ctx.arcTo(x, y + h, x, y, rr);
          ctx.arcTo(x, y, x + w, y, rr);
          ctx.closePath();
          ctx.fill();
        }

        // Input handling
        const opposite = { up: 'down', down: 'up', left: 'right', right: 'left' };
        function queueDirection(next) {
          if (phase !== 'running') return;
          if (snakeBody.length > 1 && next === opposite[direction]) return; // prevent instant reverse
          pendingDirection = next;
        }

        window.addEventListener('keydown', (e) => {
          const key = e.key.toLowerCase();
          if (key === 'arrowup' || key === 'w') { e.preventDefault(); queueDirection('up'); }
          else if (key === 'arrowdown' || key === 's') { e.preventDefault(); queueDirection('down'); }
          else if (key === 'arrowleft' || key === 'a') { e.preventDefault(); queueDirection('left'); }
          else if (key === 'arrowright' || key === 'd') { e.preventDefault(); queueDirection('right'); }
          else if (key === 'p') { e.preventDefault(); phase === 'running' ? pauseGame() : resumeGame(); }
          else if (key === 'r') { e.preventDefault(); restartGame(); }
          else if (key === 'enter' || key === ' ') { e.preventDefault(); if (phase === 'idle' || phase === 'over' || phase === 'paused') restartGame(); }
        });

        // Buttons
        startBtn.addEventListener('click', () => startGame());
        restartBtn.addEventListener('click', () => restartGame());

        // Initial render
        setPhase('idle');
        draw();

        // Make canvas sharp on HiDPI
        function fixDPI() {
          const dpr = window.devicePixelRatio || 1;
          const cssSize = canvas.getBoundingClientRect();
          const w = Math.round(cssSize.width * dpr);
          const h = Math.round(cssSize.height * dpr);
          if (canvas.width !== w || canvas.height !== h) {
            canvas.width = w;
            canvas.height = h;
          }
        }
        // Optional: uncomment for crisper rendering when resizing container
        // window.addEventListener('resize', () => { fixDPI(); draw(); });
      })();
    </script>
  </body>
</html>
